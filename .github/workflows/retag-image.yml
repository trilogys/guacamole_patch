name: Retag existing Guacamole image

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/retag-image.yml

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy existing image to new name
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/trilogys/guacamole_patch:1.6.0 \
            ghcr.io/trilogys/guacamole:1.6.0-inputfix7

          docker buildx imagetools inspect \
            ghcr.io/trilogys/guacamole_patch:1.6.0
