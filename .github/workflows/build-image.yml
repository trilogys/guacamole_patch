name: Build and publish Guacamole image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build.sh
      - patches/**
      - tests/**
      - SHA256SUMS
      - RELEASE_METADATA.json

permissions:
  contents: read
  packages: write

concurrency:
  group: guacamole-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: 1.6.0

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        shell: bash
        run: |
          image_name="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/guacamole_patch"
          echo "PUBLISH_IMAGE=${image_name,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build patched Guacamole image
        shell: bash
        run: |
          MAVEN_ARGUMENTS="-T 1C -Dmaven.test.skip=true" \
          IMAGE_NAME="${PUBLISH_IMAGE}:${RELEASE_TAG}" \
          bash ./build.sh

      - name: Publish image tags
        shell: bash
        run: |
          source_image="${PUBLISH_IMAGE}:${RELEASE_TAG}"

          for tag in "${RELEASE_TAG}" main "sha-${SHORT_SHA}"; do
            target_image="${PUBLISH_IMAGE}:${tag}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          done

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "### Published Guacamole image"
            echo
            echo "- \`${PUBLISH_IMAGE}:${RELEASE_TAG}\`"
            echo "- \`${PUBLISH_IMAGE}:main\`"
            echo "- \`${PUBLISH_IMAGE}:sha-${SHORT_SHA}\`"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
